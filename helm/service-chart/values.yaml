# Default values for service-chart
# This is a universal chart that can be used for all services

replicaCount: 1

image:
  repository: ""  # Will be set per service
  pullPolicy: Always
  tag: "latest"

command: []
args: []

service:
  type: ClusterIP
  port: 8080

env:
  # Environment variables will be set per service
  - name: DATABASE_URL
    value: ""

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /manage/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /manage/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

