fullnameOverride: gateway-service

image:
  repository: ""  # Will be set in CI/CD
  tag: "latest"

service:
  port: 8080

env:
  - name: CARS_SERVICE_URL
    value: "http://cars-service:8070"
  - name: RENTAL_SERVICE_URL
    value: "http://rental-service:8060"
  - name: PAYMENT_SERVICE_URL
    value: "http://payment-service:8050"
  - name: OIDC_ISSUER
    value: ""
  - name: OIDC_AUDIENCE
    value: ""
  - name: OIDC_CLIENT_ID
    value: ""
  - name: OIDC_CLIENT_SECRET
    value: ""
  - name: OIDC_TOKEN_URL
    value: ""
  - name: OIDC_WELL_KNOWN_URL
    value: ""
  - name: OIDC_JWKS
    value: ""
  - name: OIDC_JWKS_URL
    value: ""
  - name: OIDC_SCOPE
    value: "openid profile email"
  - name: OIDC_REDIRECT_URI
    value: ""

command:
  - uvicorn
  - services.gateway_service.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8080"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: ""  # Will be set based on cluster ingress
      paths:
        - path: /
          pathType: Prefix

