fullnameOverride: rental-service

image:
  repository: ""  # Will be set in CI/CD
  tag: "latest"

service:
  port: 8060

env:
  - name: DATABASE_URL
    value: "postgresql://program:test@postgres:5432/rentals"
  - name: OIDC_ISSUER
    value: ""
  - name: OIDC_AUDIENCE
    value: ""
  - name: OIDC_CLIENT_ID
    value: ""
  - name: OIDC_CLIENT_SECRET
    value: ""
  - name: OIDC_TOKEN_URL
    value: ""
  - name: OIDC_WELL_KNOWN_URL
    value: ""
  - name: OIDC_JWKS
    value: ""
  - name: OIDC_JWKS_URL
    value: ""
  - name: OIDC_SCOPE
    value: "openid profile email"
  - name: OIDC_REDIRECT_URI
    value: ""

command:
  - uvicorn
  - services.rental_service.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8060"

